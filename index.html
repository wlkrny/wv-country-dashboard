<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f6f4">
  <title>Climate Negotiation Simulation Workshop</title>
  <style>
    :root{color-scheme:light;--ink:#191919;--muted:#737370;--line:#dededb;--paper:#fff;--ground:#f6f6f4;--accent:#171717;--soft:#ececea}
    *{box-sizing:border-box}body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}button,select,input{font:inherit}button{cursor:pointer;transition:color .14s ease,background-color .14s ease,transform .12s ease}button:active{transform:scale(.97)}.page{max-width:1184px;margin:auto;padding:40px 32px 28px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.title{font-size:26px;font-weight:600;letter-spacing:-.035em;margin:0 0 14px}.nav{display:flex;gap:22px}.nav-tab{padding:3px 0 7px;border:0;border-bottom:1px solid transparent;background:transparent;color:var(--muted);font-size:13px}.nav-tab.active{border-bottom-color:var(--ink);color:var(--ink)}.primary{border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;padding:11px 17px}.primary:hover{background:#373735}.result{min-height:22px;margin:0 0 18px;color:var(--muted);font-size:13px}.result strong{font-weight:600;color:var(--ink)}.scroll{overflow-x:auto}.board{min-width:1050px}.head,.row{display:grid;grid-template-columns:minmax(240px,2.2fr) repeat(4,minmax(76px,.85fr)) minmax(92px,1fr) minmax(96px,.9fr) minmax(72px,.75fr);align-items:center;column-gap:10px}.head{padding:0 12px 10px;color:var(--muted);font-size:12px}.head span:not(:first-child){text-align:center}.row{min-height:76px;padding:8px 12px;border-top:.5px solid var(--line)}.identity{display:flex;flex-direction:column;align-items:flex-start;gap:5px;min-width:0}.country-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.country{font-size:15px;font-weight:600;white-space:nowrap}.applied-actions{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.applied-action{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}.choose-action{padding:4px 0;border:0;border-radius:0;background:transparent;color:var(--ink);font-size:12px;font-weight:600;text-align:left;text-decoration:underline;text-underline-offset:3px}.choose-action:hover{color:var(--muted)}.control{display:flex;justify-content:center;align-items:center;gap:7px;font-variant-numeric:tabular-nums}.value{min-width:22px;text-align:center;font-size:16px;font-weight:600}.step{width:28px;height:28px;padding:0;border:0;border-radius:7px;background:transparent;color:#595956;font-size:18px;line-height:1}.step:hover{background:var(--soft);color:#111}.step:focus-visible,.primary:focus-visible,.quiet:focus-visible,.nav-tab:focus-visible,.choose-action:focus-visible,.secondary:focus-visible,.edit:focus-visible,.input:focus-visible{outline:2px solid #111;outline-offset:2px}.emission .value{color:#333}.score{justify-self:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.score.pending{color:#aaa;font-weight:400}.counters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;margin-top:28px;padding-top:16px;border-top:.5px solid var(--line)}.counter{display:flex;align-items:center;justify-content:space-between;gap:14px}.counter-label{color:var(--muted);font-size:13px}.counter-value{font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;min-width:24px;text-align:center}.counter-controls{display:flex;align-items:center;gap:6px}.counter .step{border:0;background:transparent}.counter .step:hover{background:var(--soft)}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:25px;padding-top:14px;border-top:.5px solid var(--line);color:var(--muted);font-size:12px}.credit{color:#898986}.quiet,.secondary{border:0;background:transparent;padding:5px 0;color:var(--muted);font-size:12px}.quiet:hover,.secondary:hover{color:var(--ink)}.cards-head,.card-row{display:grid;grid-template-columns:minmax(260px,2.3fr) repeat(4,minmax(74px,.85fr)) 56px;align-items:center;column-gap:12px}.cards-head{padding:0 12px 10px;color:var(--muted);font-size:12px}.cards-head span:not(:first-child){text-align:center}.card-row{min-height:52px;padding:7px 12px;border-top:.5px solid var(--line)}.card-name{font-size:13px;font-weight:500}.card-number{color:var(--muted);display:inline-block;min-width:30px;font-variant-numeric:tabular-nums}.delta-view{text-align:center;color:#444;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}.mobile-effects{display:none}.edit{justify-self:end;border:0;background:transparent;color:var(--muted);font-size:12px;padding:5px}.edit:hover{color:var(--ink)}.bottom{margin-top:26px}.credit{color:#898986}dialog{width:min(680px,calc(100% - 28px));max-height:calc(100% - 28px);padding:0;border:0;border-radius:12px;background:var(--ground);color:var(--ink);box-shadow:none;overflow:hidden}dialog[open]{animation:softEnter .16s ease-out both}dialog::backdrop{background:#dededb}.modal{padding:24px}.modal-scroll{max-height:min(70vh,640px);overflow:auto}.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.modal-title{font-size:20px;font-weight:600;letter-spacing:-.02em;margin:0}.modal-actions{display:flex;justify-content:flex-end;gap:16px;align-items:center;padding-top:20px}.modal-actions .primary{min-width:140px}.modal-actions .quiet{padding:10px 0}.temp{display:flex;align-items:center;gap:8px;padding:14px 0 18px;border-bottom:.5px solid var(--line);font-size:13px}.temp-label{margin-right:auto;color:var(--muted)}.temp-value{min-width:62px;text-align:center;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}.settle-head,.settle-row{display:grid;grid-template-columns:1.2fr .8fr;align-items:center;column-gap:12px}.settle-head{padding:18px 8px 8px;color:var(--muted);font-size:12px}.settle-head span:not(:first-child){text-align:center}.settle-row{min-height:48px;padding:4px 8px;border-top:.5px solid var(--line)}.settle-row .control{justify-content:center}.action-options{max-height:70vh;overflow:auto}.action-choice{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 4px;border:0;border-top:.5px solid var(--line);background:transparent;text-align:left;color:var(--ink)}.action-choice:hover{background:#f6f6f4}.action-choice-name{font-size:13px}.action-choice-meta{font-size:12px;color:var(--muted);white-space:nowrap}.editor-labels,.editor-row{display:grid;grid-template-columns:minmax(100px,1fr) 1fr 1fr;align-items:center;gap:12px}.editor-labels{padding:12px 8px 7px;color:var(--muted);font-size:12px}.editor-labels span:not(:first-child){text-align:center}.editor-row{min-height:48px;padding:5px 8px;border-top:.5px solid var(--line)}.editor-field{display:flex;align-items:center;justify-content:center;gap:8px}.editor-field label{font-size:12px;color:var(--muted)}.input{width:68px;height:34px;border:0;border-radius:0;background:transparent;color:var(--ink);padding:4px 8px;text-align:center;font-variant-numeric:tabular-nums}.emission-edit{display:flex;align-items:center;gap:12px;padding:14px 8px;border-top:.5px solid var(--line)}.emission-edit label{margin-right:auto;color:var(--muted);font-size:13px}.view-motion{animation:softEnter .16s ease-out both}@keyframes softEnter{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
    [hidden]{display:none!important}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}button:active{transform:none}}
    @media(max-width:760px){.page{padding:28px 20px}.top{align-items:flex-start}.scroll{overflow:visible}.board{min-width:0}.head{display:none}.row{grid-template-columns:repeat(6,minmax(0,1fr));column-gap:8px;min-height:0;padding:12px 8px 14px}.identity{grid-column:1/6;grid-row:1;gap:4px}.country{font-size:15px}.score{grid-column:6/7;grid-row:1;justify-self:end;align-self:start;padding-top:2px}.control{flex-direction:column;gap:2px;padding-top:8px}.control::before{content:attr(data-label);min-height:18px;color:var(--muted);font-size:12px;line-height:1.2;text-align:center}.control .step[data-delta="1"]{order:0}.control .value{order:1}.control .step[data-delta="-1"]{order:2}.step{width:32px;height:30px}.counters{gap:12px}.counter{align-items:center;flex-direction:column;gap:6px}.counter-controls{width:auto;flex-direction:column;gap:2px}.counter-controls .step[data-delta="1"]{order:0}.counter-value{order:1}.counter-controls .step[data-delta="-1"]{order:2}.cards-head{display:none}.cards-board{min-width:0}.card-row{grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 8px}.card-name{grid-column:1}.delta-view{display:none}.mobile-effects{display:block;grid-column:1/-1;color:var(--muted);font-size:12px}.edit{grid-column:2;grid-row:1}.bottom{margin-top:20px}}
    @media(max-width:600px){.page{padding:24px 16px}.title{font-size:23px}.primary{padding:10px 13px}.nav{gap:18px}.modal{padding:20px}.settle-head,.settle-row{grid-template-columns:1.1fr .9fr;column-gap:4px}.settle-head{font-size:12px}.editor-labels,.editor-row{grid-template-columns:minmax(80px,.8fr) 1fr 1fr;gap:6px}.input{width:56px}.action-choice{grid-template-columns:minmax(0,1fr) auto;gap:8px}.action-choice-meta{font-size:12px}}
    @media(max-width:380px){.page{padding:20px 12px}.row{column-gap:4px;padding-left:4px;padding-right:4px}.control::before{font-size:12px}.step{width:30px;height:30px}.value{min-width:20px;font-size:15px}.counters{gap:8px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top"><div><h1 class="title" id="pageTitle">Country Scoreboard</h1><nav class="nav" aria-label="Pages"><button class="nav-tab active" data-page="scoreboard">Scoreboard</button><button class="nav-tab" data-page="actions">Action Cards</button></nav></div><button class="primary" id="openSettlement">Settle scores</button></header>
    <section id="scoreboardPage">
      <p class="result" id="result" aria-live="polite" hidden></p>
      <section class="scroll" aria-label="Country scores"><div class="board"><div class="head"><span>Country</span><span>Tech</span><span>Budget</span><span>Governance</span><span>Labour</span><span>Emission</span><span>Summit actions</span><span>Score</span></div><div id="countries"></div></div></section>
      <section class="counters" id="counters" aria-label="Workshop counters"></section>
    </section>
    <section id="actionsPage" hidden>
      <div class="cards-scroll"><div class="cards-board"><div class="cards-head"><span>Action card</span><span>Tech</span><span>Budget</span><span>Governance</span><span>Labour</span><span></span></div><div id="actionRows"></div></div></div>
    </section>
    <footer class="bottom"><button class="quiet" id="reset">Reset values</button><span class="credit">Climate Negotiation Simulation Workshop</span></footer>
  </main>

  <dialog id="settlement"><form class="modal" method="dialog" id="settlementForm"><div class="modal-head"><h2 class="modal-title">Settlement inputs</h2><button class="quiet" value="cancel">Close</button></div><div class="temp"><span class="temp-label">Global temperature</span><span class="temp-value" id="tempValue">1.43°C</span></div><div class="settle-head"><span>Country</span><span>Goals achieved</span></div><div id="settlementRows"></div><div class="modal-actions"><button class="quiet" value="cancel">Cancel</button><button class="primary" id="calculate" value="default">Calculate scores</button></div></form></dialog>
  <dialog id="actionPicker"><div class="modal"><div class="modal-head"><h2 class="modal-title" id="actionPickerTitle">Choose action</h2><button class="quiet" data-close="actionPicker">Close</button></div><div class="action-options" id="actionOptions"></div></div></dialog>
  <dialog id="actionEditor"><form class="modal" method="dialog"><div class="modal-head"><h2 class="modal-title" id="editorTitle">Edit action card</h2><button class="quiet" value="cancel">Close</button></div><div class="modal-scroll"><div class="editor-labels"><span>Resource</span><span>Gain</span><span>Cost</span></div><div id="editorRows"></div><div class="emission-edit"><label for="editEmission">Emission change</label><input class="input" id="editEmission" type="number" step="1"></div></div><div class="modal-actions"><button class="quiet" value="cancel">Cancel</button><button class="primary" id="saveAction" value="default">Save changes</button></div></form></dialog>

  <script>
    const initial=[
      {id:'A',tech:8,budget:9,governance:6,labour:7,emission:15,goals:0,summit:0},
      {id:'B',tech:8,budget:8,governance:5,labour:6,emission:13,goals:0,summit:0},
      {id:'C',tech:7,budget:6,governance:6,labour:5,emission:12,goals:0,summit:0},
      {id:'D',tech:4,budget:5,governance:7,labour:5,emission:10,goals:0,summit:0},
      {id:'E',tech:4,budget:3,governance:5,labour:5,emission:8,goals:0,summit:0},
      {id:'F',tech:4,budget:3,governance:4,labour:3,emission:7,goals:0,summit:0}
    ];
    const resourceKeys=['tech','budget','governance','labour'];
    const labels={tech:'Tech',budget:'Budget',governance:'Governance',labour:'Labour',emission:'Emission'};
    const defaultActions=[
      {id:1,name:'Solar Farm Installation',emission:-3,gain:{tech:2},cost:{tech:2,budget:2}},
      {id:2,name:'Launch National Reforestation Program',emission:-3,gain:{governance:1,labour:1},cost:{budget:1,labour:2}},
      {id:3,name:'Expand Electric Public Transport',emission:-2,gain:{tech:1,labour:1},cost:{budget:2,governance:1}},
      {id:4,name:'Implement Green Fiscal Reform',emission:-2,gain:{budget:1,labour:1},cost:{governance:2}},
      {id:5,name:'Implement a National Circular Economy Strategy',emission:-2,gain:{budget:2,labour:1},cost:{tech:1,governance:2}},
      {id:6,name:'Construct Coastal Sea Defences',emission:2,gain:{governance:1},cost:{budget:1,labour:1}},
      {id:7,name:'Implement Water-Efficient Irrigation Systems',emission:-1,gain:{governance:1,labour:1},cost:{tech:1,budget:1}},
      {id:8,name:'Launch a National WASH Initiative',emission:-1,gain:{governance:1,labour:1},cost:{budget:2,governance:1}},
      {id:9,name:'Develop Climate-Resilient Agriculture',emission:-1,gain:{budget:1,labour:1},cost:{tech:1,labour:1}},
      {id:10,name:'Construct Climate-Resilient Housing',emission:2,gain:{labour:2},cost:{tech:1,budget:2}},
      {id:11,name:'Establish Export-Oriented Manufacturing Zones',emission:4,gain:{budget:1,labour:2},cost:{tech:1,budget:2}},
      {id:12,name:'Expand Coal-Fired Power Generation',emission:6,gain:{tech:1,budget:2},cost:{tech:3,labour:2}},
      {id:13,name:'Implement an Agricultural Intensification Program',emission:4,gain:{budget:2,labour:1},cost:{budget:2,governance:1}},
      {id:14,name:'Fund National Research and Innovation Programs',emission:2,gain:{tech:2,budget:1},cost:{budget:2,labour:1}},
      {id:15,name:'Expand National Highway Networks',emission:5,gain:{budget:2,labour:2},cost:{budget:2,labour:1}}
    ];
    const storeKey='wv-country-scoreboard-v2';
    let state={values:initial.map(x=>({...x})),actions:structuredClone(defaultActions),counters:{event:0,round:0,summit:0},actionHistory:Object.fromEntries(initial.map(c=>[c.id,[]])),scores:null,settledAt:null,tempScore:null,schema:6};
    try{const saved=JSON.parse(localStorage.getItem(storeKey)||'null');if(saved?.values?.length===6){state={...state,...saved};if(!Array.isArray(saved.actions))state.actions=structuredClone(defaultActions);if(!saved.counters)state.counters={event:0,round:0,summit:0};if(!saved.actionHistory)state.actionHistory=Object.fromEntries(initial.map(c=>[c.id,[]]));if(saved.schema!==6){state.scores=null;state.settledAt=null;state.tempScore=null;state.schema=6}}}catch{}
    let draft={goals:[]};let pickerCountry=null;let editingAction=null;
    const $=s=>document.querySelector(s);
    const fmt=n=>Number.isInteger(n)?String(n):Number(n).toFixed(1);
    const signed=n=>n>0?`+${n}`:String(n).replace('-','−');
    function persist(){localStorage.setItem(storeKey,JSON.stringify(state));render()}
    function net(action,key){return(action.gain[key]||0)-(action.cost[key]||0)}
    function resourceDisplay(action,key){const g=action.gain[key]||0,c=action.cost[key]||0;if(g&&c)return`+${g} / −${c}`;if(g)return`+${g}`;if(c)return`−${c}`;return'—'}
    function resourceSummary(action){return resourceKeys.map(k=>{const g=action.gain[k]||0,c=action.cost[k]||0;return g||c?`${labels[k]} ${resourceDisplay(action,k)}`:null}).filter(Boolean).join('  ')}
    function render(){
      $('#countries').innerHTML=state.values.map(c=>`<div class="row"><div class="identity"><div class="country-line"><span class="country">Country ${c.id}</span><span class="applied-actions">${(state.actionHistory[c.id]||[]).map(id=>`<span class="applied-action">#${id}</span>`).join('')}</span></div><button class="choose-action" data-choose="${c.id}">Choose action</button></div>${[...resourceKeys,'emission','summit'].map(k=>`<div class="control ${k==='emission'?'emission':''}" data-label="${k==='summit'?'Summit actions':labels[k]}"><button class="step" data-kind="value" data-id="${c.id}" data-key="${k}" data-delta="-1" aria-label="Decrease ${k==='summit'?'Summit actions':labels[k]}">−</button><span class="value">${c[k]}</span><button class="step" data-kind="value" data-id="${c.id}" data-key="${k}" data-delta="1" aria-label="Increase ${k==='summit'?'Summit actions':labels[k]}">+</button></div>`).join('')}<span class="score ${state.scores?'':'pending'}">${state.scores?fmt(state.scores[c.id].total):'—'}</span></div>`).join('');
      $('#result').hidden=!state.scores;
      if(state.scores){const individual=Object.values(state.scores).reduce((n,x)=>n+x.total,0);$('#result').innerHTML=`<strong>Individual ${fmt(individual)} &nbsp; Global ${fmt(state.tempScore)} &nbsp; Total ${fmt(individual+state.tempScore)}</strong>`}else $('#result').textContent='';
      $('#counters').innerHTML=['event','round','summit'].map(k=>`<div class="counter"><span class="counter-label">${k[0].toUpperCase()+k.slice(1)} No.</span><div class="counter-controls"><button class="step" data-counter="${k}" data-delta="-1" aria-label="Decrease ${k} number">−</button><span class="counter-value">${state.counters[k]}</span><button class="step" data-counter="${k}" data-delta="1" aria-label="Increase ${k} number">+</button></div></div>`).join('');
      $('#actionRows').innerHTML=state.actions.map(a=>`<div class="card-row"><span class="card-name"><span class="card-number">#${a.id}</span>${a.name}</span>${resourceKeys.map(k=>`<span class="delta-view">${resourceDisplay(a,k)}</span>`).join('')}<span class="mobile-effects">${resourceSummary(a)||'No resource change'}</span><button class="edit" data-edit="${a.id}">Edit</button></div>`).join('');
    }
    function renderSettlement(){
      $('#tempValue').textContent=`${globalTemperature().toFixed(2)}°C`;
      $('#settlementRows').innerHTML=state.values.map((c,i)=>`<div class="settle-row"><span class="country">Country ${c.id}</span><div class="control"><button class="step" type="button" data-kind="draft" data-key="goals" data-index="${i}" data-delta="-1" aria-label="Decrease goals achieved">−</button><span class="value">${draft.goals[i]}</span><button class="step" type="button" data-kind="draft" data-key="goals" data-index="${i}" data-delta="1" aria-label="Increase goals achieved">+</button></div></div>`).join('');
    }
    function globalTemperature(){const starting=initial.reduce((sum,c)=>sum+c.emission,0);const current=state.values.reduce((sum,c)=>sum+c.emission,0);return 1.43+(current-starting)*.02}
    function calculate(c){const base=initial.find(x=>x.id===c.id);const resource=(c.tech+c.budget+c.governance+c.labour)*.5;const emission=base.emission-c.emission;const summit=c.summit*2;const goals=c.goals*5;return{total:resource+emission+summit+goals,resource,emission,summit,goals}}
    function temperaturePoints(t){if(t<1.23)return 40;if(t<1.33)return 30;if(t<1.43)return 20;if(t<1.5)return 15;if(t<1.6)return 10;if(t<2)return 5;return -20}
    function openPicker(country){pickerCountry=country;$('#actionPickerTitle').textContent=`Country ${country} action`;$('#actionOptions').innerHTML=state.actions.map(a=>`<button class="action-choice" data-action-choice="${a.id}"><span><span class="card-number">#${a.id}</span><span class="action-choice-name">${a.name}</span><br><span class="action-choice-meta">${resourceSummary(a)||'No resource change'}</span></span></button>`).join('');$('#actionPicker').showModal()}
    function applyAction(country,id){const c=state.values.find(x=>x.id===country);const a=state.actions.find(x=>x.id===id);if(!c||!a)return;for(const k of resourceKeys)c[k]=Math.max(0,c[k]+net(a,k));c.emission=Math.max(0,c.emission+a.emission);state.actionHistory[country]=state.actionHistory[country]||[];state.actionHistory[country].push(id);state.scores=null;state.settledAt=null;state.tempScore=null;$('#actionPicker').close();persist()}
    function openEditor(id){editingAction=state.actions.find(a=>a.id===id);if(!editingAction)return;$('#editorTitle').textContent=`Edit #${id} ${editingAction.name}`;$('#editorRows').innerHTML=resourceKeys.map(k=>`<div class="editor-row"><span>${labels[k]}</span><div class="editor-field"><label for="gain-${k}">Gain</label><input class="input" id="gain-${k}" data-edit-key="${k}" data-edit-type="gain" type="number" min="0" step="1" value="${editingAction.gain[k]||0}"></div><div class="editor-field"><label for="cost-${k}">Cost</label><input class="input" id="cost-${k}" data-edit-key="${k}" data-edit-type="cost" type="number" min="0" step="1" value="${editingAction.cost[k]||0}"></div></div>`).join('');$('#editEmission').value=editingAction.emission;$('#actionEditor').showModal()}
    document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{const page=b.dataset.page;$('#scoreboardPage').hidden=page!=='scoreboard';$('#actionsPage').hidden=page!=='actions';const visible=page==='scoreboard'?$('#scoreboardPage'):$('#actionsPage');visible.classList.remove('view-motion');void visible.offsetWidth;visible.classList.add('view-motion');$('#openSettlement').hidden=page!=='scoreboard';$('#pageTitle').textContent=page==='scoreboard'?'Country Scoreboard':'Action Cards';document.querySelectorAll('.nav-tab').forEach(t=>t.classList.toggle('active',t===b))}));
    $('#countries').addEventListener('click',e=>{const actionButton=e.target.closest('[data-choose]');if(actionButton){openPicker(actionButton.dataset.choose);return}const b=e.target.closest('[data-kind="value"]');if(!b)return;const c=state.values.find(x=>x.id===b.dataset.id);const key=b.dataset.key;c[key]=Math.max(0,c[key]+Number(b.dataset.delta));state.scores=null;state.settledAt=null;state.tempScore=null;persist()});
    $('#counters').addEventListener('click',e=>{const b=e.target.closest('[data-counter]');if(!b)return;const key=b.dataset.counter;state.counters[key]=Math.max(0,state.counters[key]+Number(b.dataset.delta));persist()});
    $('#actionPicker').addEventListener('click',e=>{const b=e.target.closest('[data-action-choice]');if(b)applyAction(pickerCountry,Number(b.dataset.actionChoice));if(e.target.closest('[data-close]'))$('#actionPicker').close()});
    $('#actionsPage').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b)openEditor(Number(b.dataset.edit))});
    $('#actionEditor').addEventListener('click',e=>{if(e.target.id!=='saveAction')return;e.preventDefault();for(const input of $('#editorRows').querySelectorAll('[data-edit-key]')){const key=input.dataset.editKey,type=input.dataset.editType;editingAction[type][key]=Math.max(0,Number(input.value)||0)}editingAction.emission=Number($('#editEmission').value)||0;$('#actionEditor').close();persist()});
    $('#openSettlement').addEventListener('click',()=>{draft={goals:state.values.map(c=>c.goals||0)};renderSettlement();$('#settlement').showModal()});
    $('#settlement').addEventListener('click',e=>{const b=e.target.closest('[data-kind="draft"]');if(!b)return;const key=b.dataset.key,index=Number(b.dataset.index);draft[key][index]=Math.max(0,Math.min(3,draft[key][index]+Number(b.dataset.delta)));renderSettlement()});
    $('#calculate').addEventListener('click',e=>{e.preventDefault();state.values.forEach((c,i)=>{c.goals=draft.goals[i]});state.scores=Object.fromEntries(state.values.map(c=>[c.id,calculate(c)]));state.tempScore=temperaturePoints(globalTemperature());state.settledAt=new Date().toISOString();$('#settlement').close();persist()});
    $('#reset').addEventListener('click',()=>{if(confirm('Reset all values to their starting levels?')){state={values:initial.map(x=>({...x})),actions:structuredClone(defaultActions),counters:{event:0,round:0,summit:0},actionHistory:Object.fromEntries(initial.map(c=>[c.id,[]])),scores:null,settledAt:null,tempScore:null,schema:6};persist()}});
    render();
  </script>
</body>
</html>
